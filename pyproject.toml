[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "rfuns"
version = "0.1.0"
description = "Python implementations of common R base functions"
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff", "rpy2"]

[tool.setuptools.packages.find]
where = ["."]
