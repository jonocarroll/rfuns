project:
  type: website
  output-dir: _site

website:
  title: "rfuns"
  description: "Python implementations of common R base functions"
  page-navigation: true
  page-footer:
    center: |
      Made by [Jonathan Carroll](https://jcarroll.com.au)
  navbar:
    background: light
    pinned: true
    logo: rfuns_logo.png
    left:
      - text: "Get started"
        file: get_started.qmd
      - text: "Reference"
        file: reference/index.qmd
    right:
      - icon: github
        href: https://github.com/jonocarroll/rfuns
        aria-label: rfuns GitHub
  sidebar:
