# tell quarto to read the generated styles
format:
  html:
    sidebar: true


# tell quarto to read the generated sidebar
metadata-files:
  - reference/_sidebar.yml

quartodoc:
  # the name used to import the package you want to create reference docs for
  package: rfuns

  # write sidebar and style data
  sidebar: reference/_sidebar.yml
  css: reference/_styles-quartodoc.css

  sections:
    - title: Strings
      desc: String manipulation functions.
      contents:
        - nchar
        - nzchar
        - paste
        - paste0
        - grepl
        - grep
        - gsub
        - sub
        - trimws
        - toupper
        - tolower
        - startsWith
        - endsWith
        - strsplit
        - substr
        - chartr
        - formatC

    - title: Vectors
      desc: Vector manipulation functions.
      contents:
        - which
        - which_min
        - which_max
        - diff
        - cumsum
        - cumprod
        - cummax
        - cummin
        - rev
        - duplicated
        - setdiff
        - intersect
        - union
        - unique
        - seq_along
        - seq_len
        - seq
        - r_range

    - title: Math
      desc: Math operations.
      contents:
        - sign
        - trunc
        - ceiling
        - floor
        - sqrt
        - log
        - log2
        - log10
        - exp
        - abs
        - var
        - sd
        - mean
        - median
        - quantile
        - scale
        - round

    - title: Files
      desc: File and path utilities.
      contents:
        - list_files
        - file_exists
        - dir_exists
        - basename
        - dirname
        - file_path

    - title: Table
      desc: Tabulation functions.
      contents:
        - table
        - prop_table
        - margin_table

    - title: Functional
      desc: Functional programming helpers.
      contents:
        - lapply
        - sapply
        - vapply
        - tapply
        - rapply
        - Filter
        - Map
        - Reduce

    - title: Inspect
      desc: Inspection and summary functions.
      contents:
        - head
        - tail
        - length
        - nrow
        - ncol
        - dim
        - summary
        - rstr

    - title: Utils
      desc: Utility helpers.
      contents:
        - vec